<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0A2A5E">
<title>LEE 60 - IE 121 Virgen de Fátima</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:Poppins,system-ui,sans-serif;background:#eef5ff;color:#0A2A5E;min-height:100vh;display:flex;flex-direction:column}
.btn{background:#0A2A5E;color:#fff;border-radius:.75rem;padding:.5rem 1rem;font-weight:600}.btn:hover{background:#3AA0FF}
.btn:disabled{opacity:.4;cursor:not-allowed}.card{background:#fff;border-radius:1rem;box-shadow:0 2px 10px #0a2a5e22;padding:1rem}
input,select,textarea{border:1px solid #b6c9e8;border-radius:.6rem;padding:.45rem .7rem;width:100%;background:#fff;color:#0A2A5E}
mark{background:#fde047}.night{background:#111827!important;color:#e5e7eb!important}.night mark{color:#111}
td,th{padding:.4rem .6rem;border-bottom:1px solid #dbe6f7;text-align:left;font-size:.8rem}
</style></head>
<body>
<header class="bg-[#0A2A5E] text-white p-3 flex items-center justify-between shadow-lg">
 <div class="flex items-center gap-3 min-w-0">
  <img src="logo_ie121.png" alt="Escudo de la IE 121 Virgen de Fátima" class="w-12 h-12 sm:w-14 sm:h-14 object-contain rounded-xl bg-white p-1 shrink-0">
  <div class="min-w-0"><div class="font-bold leading-tight tracking-wide">AULA DE INNOVACIÓN PEDAGÓGICA</div><div class="text-xs opacity-90">IE 121 Virgen de Fátima</div><div class="text-[10px] opacity-75">1 Hora de Lectura Diaria · v5</div></div>
 </div>
 <button id="out" class="hidden btn !bg-[#3AA0FF] text-sm shrink-0" onclick="salir()">Salir</button>
</header>
<main id="app" class="flex-1 p-4 max-w-6xl w-full mx-auto"></main>
<footer class="text-center text-[11px] text-gray-500 p-3">
 © 2026 EdTech - Ingeniería Educativa · Prof. Pedro Acevedo Elguera<br>
 <button class="underline text-[10px] mt-1" onclick="loginAdmin()">Administración PIP</button>
</footer>
<div id="modal" class="hidden fixed inset-0 bg-black/60 z-50 overflow-auto p-3"></div>

<script>
/* ===== CONFIGURACIÓN (editable) ===== */
const TOTAL = 1200;    // duración total en segundos (20 min)
const T_ANTES = 180;   // fase ANTES: 3 min
const T_DESPUES = 180; // fase DESPUÉS: 3 min (DURANTE = el resto, 14 min)
const VEL = 1; // 1 = tiempo real. Usa 60 para probar (1 s = 1 min)
const P = 'lee60_ie121_';
const URL_SHEETS = 'https://script.google.com/macros/s/AKfycby2mbFlE7Yb5OsA8EWeBAeVOXnENpPJDPTECQyUWcw98fXGHWmY0xOEiH2GZ2R_pp90/exec'; // <-- pega aquí la URL /exec de tu Apps Script

/* ===== UTILIDADES ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld = (k, d) => { try { const v = localStorage.getItem(P + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const sv = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) { alert('Almacenamiento lleno: exporta un backup y borra audios.'); } };
const hoy = () => new Date().toLocaleDateString('en-CA', {timeZone:'America/Lima'});
const GRADOS = ['1° Prim','2° Prim','3° Prim','4° Prim','5° Prim','6° Prim','1° Sec','2° Sec','3° Sec','4° Sec','5° Sec'];
const EMOS = ['😄','🙂','😐','😟','😢'];

/* ===== DATOS ===== */
const nuevo = (sid, n, g, s) => ({sid, n, g, s, libro: null, t0: null, seg: 0, est: 'Sin iniciar', fecha: '', res: '', emo: '', pts: 0, audio: '', hl: {}, xp: 0, dias: [], leidos: [], antes: {}});
let S = ld('est', []), L = ld('libros', []), U = null, ADM = false, ADMIN_SESSION = '', STUDENT_SESSION = '', SESSION = '', DASH = [], EDIT = null, tick = null, pausa = null, lastFase = '';
const save = () => { sv('est', S); sv('libros', L); };
const normGrado = g => String(g || '').toLowerCase().replace(/\s+/g, ' ').trim();

/* ===== SINCRONIZACIÓN DE EVENTOS (cola para cortes de internet) ===== */
let sync = false;
const cola = () => ld('cola', []);
function enviar(tipo, d) {
  const ev = {id: Date.now() + '-' + Math.random().toString(36).slice(2, 9), tipo, ts: new Date().toISOString(), ...d};
  const c = cola(); c.push({session: STUDENT_SESSION, ev}); sv('cola', c); vaciar();
}
async function vaciar() {
  if (!URL_SHEETS || sync || !navigator.onLine) return;
  sync = true;
  try {
    while (cola().length) {
      const pending = cola();
      let item = pending[0];
      // Descarta eventos antiguos que usaban DNI o no llevan el ID de sesión v5.
      if (item && (!item.ev || !item.ev.sid)) { sv('cola', pending.slice(1)); continue; }
      if (!item || !item.session || !item.ev) break;
      let j = await post({accion:'evento', session:item.session, ev:item.ev});
      if (!j.ok && /sesión venció/i.test(j.error || '')) break;
      if (!j.ok) break;
      if (j.feedback && U && String(item.ev.sid) === String(U.sid)) {
        U.feedback = j.feedback; U.pendingFeedback = false; U.pts = j.feedback.aciertos || 0; save();
        if ($('#app') && $('#app').querySelector('#feedbackEstudiante')) {
          $('#feedbackEstudiante').innerHTML = htmlFeedback(j.feedback);
        }
      }
      sv('cola', cola().slice(1));
    }
  } catch (e) { /* La cola se conserva para reintentar cuando vuelva la conexión. */ }
  sync = false;
}
addEventListener('online', vaciar); setInterval(vaciar, 30000);

/* ===== CONEXIÓN SEGURA CON APPS SCRIPT ===== */
async function post(o) {
  if (!URL_SHEETS) throw new Error('Falta configurar la URL de Apps Script.');
  const r = await fetch(URL_SHEETS, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(o)});
  return r.json();
}
async function postAdmin(op, extra={}) {
  return post(Object.assign({accion:'admin', op, session:ADMIN_SESSION}, extra));
}
async function cargarNube(force) {
  if (!URL_SHEETS || !navigator.onLine || !SESSION) return false;
  try {
    const url = URL_SHEETS + '?action=libros&session=' + encodeURIComponent(SESSION);
    const r = await fetch(url, {signal:AbortSignal.timeout(10000)});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'No se pudo consultar la biblioteca.');
    L = Array.isArray(j.libros) ? j.libros : [];
    if (!ADM && U) L = L.filter(b => normGrado(b.g) === normGrado(U.g));
    sv('libros', L);
    return true;
  } catch (e) {
    if (force) throw e;
    return false;
  }
}
async function cargarHistorialEstudiante() {
  if (!U || !STUDENT_SESSION || !navigator.onLine) return;
  try {
    const url = URL_SHEETS + '?action=misEvaluaciones&session=' + encodeURIComponent(STUDENT_SESSION);
    const r = await fetch(url, {signal:AbortSignal.timeout(10000)});
    const j = await r.json();
    if (j.ok && Array.isArray(j.evaluaciones)) {
      U.historial = j.evaluaciones;
      if (j.evaluaciones.length) U.feedback = j.evaluaciones[0];
      U.pendingFeedback = false; save();
    }
  } catch (e) { /* La vista puede funcionar con el progreso local si no hay conexión. */ }
}

function leerArchivo(f) { // PDF tal cual; imágenes se reducen a 1600 px JPEG para aligerar
  return new Promise((ok, no) => {
    if (!/^(application\/pdf|image\/(png|jpeg))$/.test(f.type)) return no('Solo PDF, PNG o JPG.');
    if (f.size > 10 * 1024 * 1024) return no('El archivo supera 10 MB.');
    const fr = new FileReader();
    fr.onerror = () => no('No se pudo leer el archivo.');
    fr.onload = () => {
      if (f.type === 'application/pdf') return ok({nombre: f.name, mime: f.type, b64: fr.result.split(',')[1]});
      const im = new Image(); im.onerror = () => no('Imagen inválida.');
      im.onload = () => { const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        ok({nombre: f.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', .82).split(',')[1]}); };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
}

/* ===== TIEMPO ===== */
const el = r => r.t0 ? Math.min(TOTAL, Math.floor((Date.now() - r.t0) * VEL / 1000)) : r.seg;
const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const faseDe = s => s < T_ANTES ? 'antes' : s < TOTAL - T_DESPUES ? 'durante' : 'despues';
const racha = r => { let n = 0, d = new Date(); const set = new Set(r.dias); if (!set.has(d.toISOString().slice(0,10))) d.setDate(d.getDate() - 1); while (set.has(d.toISOString().slice(0,10))) { n++; d.setDate(d.getDate() - 1); } return n; };

/* ===== MODAL ===== */
const modal = h => { $('#modal').innerHTML = '<div class="bg-white rounded-2xl max-w-2xl mx-auto my-4 p-4">' + h + '</div>'; $('#modal').classList.remove('hidden'); };
const cerrar = () => { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; };

/* ===== LOGIN Y AUTENTICACIÓN ===== */
function vistaLogin() {
  clearInterval(tick); U = null; ADM = false; SESSION = ''; STUDENT_SESSION = ''; ADMIN_SESSION = '';
  $('#out').classList.add('hidden'); pausa = null;
  $('#app').innerHTML = `<div class="max-w-md mx-auto mt-5 sm:mt-8">
   <div class="card text-center space-y-3">
    <img src="logo_ie121.png" alt="Escudo institucional" class="w-28 h-28 object-contain mx-auto rounded-2xl bg-white p-1">
    <div><h1 class="text-2xl font-bold">LEE 60</h1><p class="text-sm text-slate-600">IE 121 Virgen de Fátima</p></div>
    <div class="text-sm font-semibold pt-1">Acceso de estudiantes</div>
    <input id="ln" placeholder="Apellidos y nombres" maxlength="100" autocomplete="name">
    <input id="lc" type="password" placeholder="Clave general de la IE" maxlength="30" autocomplete="current-password">
    <div class="grid grid-cols-2 gap-2 text-left"><div><label for="lg" class="text-xs font-semibold">Grado</label><select id="lg">${GRADOS.map(g => `<option>${g}</option>`).join('')}</select></div>
    <div><label for="ls" class="text-xs font-semibold">Sección</label><select id="ls">${'ABCD'.split('').map(x => `<option>${x}</option>`).join('')}</select></div></div>
    <button id="loginBtn" class="btn w-full" onclick="loginEst()">Ingresar a Leer</button>
    <p class="text-xs text-slate-500">Escribe tu nombre tal como deseas que aparezca en el registro, y utiliza la clave general indicada por tu docente.</p>
   </div>
  </div>`;
}
async function loginEst() {
  const n = $('#ln').value.trim(), codigo = $('#lc').value.trim(), g = $('#lg').value, s = $('#ls').value, btn = $('#loginBtn');
  if (n.length < 2 || n.length > 100) return alert('Escribe tus nombres y apellidos (entre 2 y 100 caracteres).');
  if (!codigo) return alert('Ingresa la clave general de la IE.');
  if (!GRADOS.includes(g) || !'ABCD'.includes(s)) return alert('Selecciona un grado y una sección válidos.');
  btn.disabled = true; btn.textContent = 'Verificando…';
  try {
    const j = await post({accion:'loginEstudiante', nombre:n, grado:g, seccion:s, codigo});
    if (!j.ok) throw new Error(j.error || 'No se pudo validar el acceso.');
    STUDENT_SESSION = j.session; SESSION = j.session; ADM = false;
    const est = j.estudiante;
    const r = nuevo(est.sid, est.n, est.g, est.s);
    S = [r]; // El progreso local pertenece a esta sesión; los registros oficiales están en Sheets.
    Object.assign(r, {sid:est.sid, n:est.n, g:est.g, s:est.s});
    r.hl ||= {}; r.antes ||= {}; r.dias ||= []; r.leidos ||= []; r.xp ||= 0; r.seg ||= 0;
    U = r; save();
    await cargarNube(true); await cargarHistorialEstudiante(); vaciar(); vistaEst();
  } catch (e) {
    alert(e.message || 'No se pudo conectar con el servidor.');
    btn.disabled = false; btn.textContent = 'Ingresar a Leer';
  }
}
async function loginAdmin() {
  const u = prompt('Usuario de administración:'); if (u === null) return;
  const c = prompt('Clave de administración:'); if (c === null) return;
  try {
    const j = await post({accion:'adminAuth', usuario:u.trim(), clave:c});
    if (!j.ok) return alert(j.error || 'Credenciales incorrectas.');
    ADMIN_SESSION = j.session; SESSION = j.session; ADM = true; U = null;
    await cargarNube(true); vistaAdm('resumen');
  } catch (e) { alert(e.message || 'No se pudo conectar con Apps Script.'); }
}
function salir() {
  if (U && U.t0 && !confirm('Tu cronómetro sigue corriendo. ¿Cerrar la sesión?')) return;
  SESSION = ''; STUDENT_SESSION = ''; ADMIN_SESSION = ''; U = null; ADM = false; pausa = null; vistaLogin();
}

/* ===== VISTA ESTUDIANTE ===== */
function htmlFeedback(f) {
  if (!f) return '';
  const pct = Number(f.porcentaje ?? f.pct ?? 0);
  const aciertos = Number(f.aciertos ?? f.pts ?? 0), total = Number(f.total ?? f.totalPreguntas ?? 0);
  const preguntas = Array.isArray(f.preguntas) ? f.preguntas : [];
  return `<div class="rounded-xl border border-blue-200 bg-blue-50 p-3 text-left">
    <div class="flex flex-wrap items-center justify-between gap-2"><b class="text-sm">📘 Mi retroalimentación</b><span class="rounded-full bg-white px-3 py-1 text-sm font-bold">${aciertos}/${total} · ${pct}%</span></div>
    <p class="text-sm mt-2">${esc(f.mensaje || 'Tu evaluación se registró correctamente.')}</p>
    ${preguntas.length ? `<div class="mt-3 space-y-2">${preguntas.map((q,i) => `<div class="rounded-lg bg-white p-2 text-xs"><div class="font-semibold">${i+1}. ${esc(q.pregunta || q.p || '')} ${q.correcta ? '✅' : '❌'}</div><div class="mt-1">Tu respuesta: ${esc(q.respuesta || '(Sin responder)')}</div>${!q.correcta ? `<div class="text-green-800 font-semibold">Respuesta correcta: ${esc(q.respuestaCorrecta || '')}</div>` : ''}<div class="mt-1 text-slate-600">${esc(q.retroalimentacion || '')}</div></div>`).join('')}</div>` : ''}
    ${f.respuestaEscrita ? `<div class="mt-3 rounded-lg bg-white p-2 text-xs"><b>Tu respuesta escrita</b><p class="mt-1 whitespace-pre-wrap">${esc(f.respuestaEscrita)}</p><p class="mt-2 text-slate-600">${esc(f.revisionDocente || 'Respuesta registrada para revisión del docente.')}</p></div>` : ''}
    ${f.fecha ? `<p class="text-[10px] text-slate-500 mt-2">Registro: ${esc(f.fecha)}</p>` : ''}
    ${f.audioDisponible ? '<p class="text-[10px] text-slate-500 mt-1">🎤 Tu audio quedó guardado en Drive.</p>' : ''}
    ${f.audioAdvertencia ? `<p class="text-xs text-amber-700 mt-1">${esc(f.audioAdvertencia)}</p>` : ''}
    ${f.pending ? '<p class="text-xs text-amber-700 mt-2">Pendiente de sincronización: la retroalimentación aparecerá cuando vuelva la conexión.</p>' : ''}
  </div>`;
}
function vistaEst() {
  if (!U) return vistaLogin();
  $('#out').classList.remove('hidden'); lastFase = '';
  const r = U, rc = racha(r), xp = r.xp || 0;
  const librosGrado = L.filter(b => normGrado(b.g) === normGrado(r.g));
  const med = [['🏃 Chasqui Lector', rc >= 5, '5 días seguidos'], ['📜 Amauta Fatimino', (r.leidos || []).length >= 10, '10 libros'], ['⛪ Virgen de Fátima Lectora', rc >= 30, '30 días seguidos']];
  $('#app').innerHTML = `
  <div class="grid md:grid-cols-3 gap-4">
   <div class="card md:col-span-2 text-center">
    <div class="text-sm">Hola, <b>${esc(r.n)}</b> · ${esc(r.g)} ${esc(r.s)}</div>
    <div id="fase" class="inline-block rounded-full px-4 py-1 text-sm font-bold mt-2"></div>
    <div id="clk" class="text-7xl font-bold my-2">20:00</div>
    <div class="h-3 bg-gray-200 rounded-full overflow-hidden flex"><div id="bar" class="h-full" style="width:0"></div></div>
    <div class="flex justify-between text-[10px] mt-1"><span>Antes 3'</span><span>Durante 14'</span><span>Después 3'</span></div>
    <div class="flex flex-wrap gap-2 justify-center mt-3">
     <button id="bI" class="btn" onclick="iniciar()">▶ Iniciar</button>
     <button id="bP" class="btn" onclick="pausar()" disabled>⏸ Pausar</button>
     <button id="bF" class="btn !bg-green-600" onclick="evidencia()" disabled>Finalizar y Evaluar</button></div>
    <div id="panel" class="mt-4 text-left"></div></div>
   <div class="card"><h2 class="font-bold mb-2">🏆 Mi progreso</h2>
    <div>⭐ XP: <b>${xp}</b></div><div>🔥 Racha: <b>${rc}</b> día(s)</div><div>📚 Lecturas: <b>${(r.leidos || []).length}</b></div>
    <div class="mt-2 space-y-1">${med.map(m => `<div class="text-sm ${m[1] ? '' : 'opacity-40'}">${m[1] ? '✅' : '🔒'} ${m[0]} <span class="text-[10px]">(${m[2]})</span></div>`).join('')}</div></div>
  </div>
  ${r.feedback ? `<section id="feedbackEstudiante" class="mt-4">${htmlFeedback(r.feedback)}</section>` : '<section id="feedbackEstudiante" class="mt-4"></section>'}
  <div class="flex items-center justify-between flex-wrap gap-2 mt-5 mb-2"><h2 class="font-bold">Biblioteca de ${esc(r.g)}</h2><span class="text-xs text-slate-500">${librosGrado.length} lectura(s) asignada(s)</span></div>
  ${librosGrado.length ? `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">${librosGrado.map(b => `
   <button onclick="abrir('${esc(b.id)}')" class="text-left rounded-xl overflow-hidden bg-white shadow hover:scale-[1.02] transition">
    <div class="h-24 flex items-center justify-center text-white text-3xl" style="background:${esc(b.c || '#0A2A5E')}">📖</div>
    <div class="p-2"><div class="text-xs font-bold leading-tight">${esc(b.t)}</div><div class="text-[10px] opacity-70">${esc(b.g)} · ${TOTAL / 60} min</div></div></button>`).join('')}</div>` : `<div class="card text-center text-sm text-slate-500">Todavía no hay lecturas publicadas para ${esc(r.g)}. Consulta con tu docente.</div>`}`;
  clearInterval(tick); tick = setInterval(upd, 500); upd();
}

const COL = {antes: ['#fef08a', '#a16207'], durante: ['#bbf7d0', '#166534'], despues: ['#bfdbfe', '#1e40af']};
function upd() {
  if (!U || !$('#clk')) return;
  const r = U, s = el(r), f = faseDe(s), corriendo = !!r.t0;
  const ver = pausa !== null ? pausa : s;
  $('#clk').textContent = mmss(TOTAL - ver);
  $('#bar').style.width = (s * 100 / TOTAL) + '%'; $('#bar').style.background = COL[f][1];
  $('#fase').textContent = {antes: 'FASE ANTES', durante: 'FASE DURANTE', despues: 'FASE DESPUÉS'}[f] + (pausa !== null ? ' · pausado (el tiempo sigue)' : '');
  $('#fase').style.cssText = `background:${COL[f][0]};color:${COL[f][1]}`;
  $('#bI').disabled = corriendo || r.est === 'Terminado'; $('#bP').disabled = !corriendo;
  $('#bP').textContent = pausa !== null ? '▶ Reanudar' : '⏸ Pausar';
  $('#bF').disabled = !(corriendo || (r.seg > 0 && r.est !== 'Terminado'));
  if (f !== lastFase) { lastFase = f; panel(f); }
  if (corriendo && s >= TOTAL) { r.seg = TOTAL; save(); }
}
function panel(f) {
  const b = L.find(x => x.id === U.libro);
  $('#panel').innerHTML = f === 'antes' ? `<div class="rounded-xl p-3" style="background:#fef9c3"><b>Antes de leer (opcional)</b><p class="text-xs mt-1">¿De qué crees que tratará esta lectura?</p>
   <textarea id="a0" rows="2" placeholder="Escribe tu predicción…" onchange="guardarAntes()">${esc((U.antes || {}).pred || '')}</textarea></div>`
  : f === 'durante' ? `<div class="rounded-xl p-3" style="background:#dcfce7">📖 Lectura activa: ${b ? `<b>${esc(b.t)}</b> <button class="btn text-xs" onclick="abrir('${esc(b.id)}')">Abrir visor</button>` : 'elige un libro de la biblioteca.'}</div>`
  : `<div class="rounded-xl p-3" style="background:#dbeafe">✍️ Cuando termines, pulsa <b>Finalizar y Evaluar</b>. Responderás preguntas de comprensión y una pregunta escrita.</div>`;
}
function guardarAntes() { U.antes = {pred: ($('#a0') || {}).value || ''}; save(); }

function iniciar() {
  if (!U.libro) return alert('Primero elige un libro de la biblioteca.');
  U.t0 = Date.now() - U.seg * 1000 / VEL; U.est = 'Leyendo'; U.fecha = hoy(); save(); enviar('inicio', {sid: U.sid, n: U.n, g: U.g, s: U.s, libroId: U.libro, libro: (L.find(x => x.id === U.libro) || {}).t}); upd();
}
function pausar() { pausa = pausa === null ? el(U) : null; upd(); }

/* ===== VISOR (texto, PDF o imagen) ===== */
let fs = 18; const blobs = {};
async function urlArchivo(a) { // baja el archivo desde Drive y lo muestra como blob local
  if (blobs[a.id]) return blobs[a.id];
  const r = await fetch(URL_SHEETS + '?action=archivo&id=' + encodeURIComponent(a.id) + '&session=' + encodeURIComponent(SESSION)); const j = await r.json(); if (!j.ok) throw new Error(j.error || 'No autorizado');

  try { const j = await postAdmin('subirTodo', {libros:L.map(({archivo, ...r}) => r)}); if (!j.ok) throw j.error; await cargarNube(true); alert('Listo.'); aBib(); }
  catch (e) { alert('Error: ' + e); }
}
function aRep() {
  $('#ab').innerHTML = `<div class="space-y-2"><h2 class="font-bold">Reportes de lectura</h2><p class="text-sm text-slate-600">Descarga los registros consolidados de la hoja Lecturas de Google Sheets.</p><button class="btn" onclick="exportar()">📊 Exportar registros a Excel</button></div>`;
}
async function exportar() {
  if (typeof XLSX === 'undefined') return alert('SheetJS no cargó (¿sin internet?).');
  try {
    const j = await postAdmin('reporte'); if (!j.ok) throw new Error(j.error || 'No se pudo obtener el reporte.');
    const rep = j.reporte || {}, wb = XLSX.utils.book_new();
    const hojas = [['Evaluaciones','evaluaciones'],['Respuestas','respuestas'],['Lecturas','lecturas'],['Sesiones','sesiones']];
    let agregadas = 0;
    hojas.forEach(([nombre, clave]) => {
      const rows = rep[clave] || [];
      if (!rows.length) return;
      const headers = rows[0];
      const data = rows.slice(1).map(row => Object.fromEntries(headers.map((h,i) => [h, row[i] || ''])));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), nombre); agregadas++;
    });
    if (!agregadas) return alert('Todavía no hay registros para exportar.');
    XLSX.writeFile(wb, 'LEE60_IE121_' + hoy() + '.xlsx');
  } catch(e) { alert(e.message); }
}

function aSis() {
  $('#ab').innerHTML = `<div class="space-y-4">
   <div><h2 class="font-bold">Código general de acceso</h2><p class="text-xs text-slate-500">Esta clave general la utilizarán todos los estudiantes junto con su nombre, grado y sección. El cambio se guarda en Google Sheets y entra en vigor inmediatamente.</p>
    <div class="grid sm:grid-cols-[1fr_auto] gap-2 mt-2"><input id="codigoNuevo" type="password" maxlength="30" placeholder="Escribe la nueva clave (mín. 3 caracteres)"><button class="btn" onclick="guardarCodigoGeneral()">Guardar código</button></div>
   </div>
   <div class="border-t pt-3"><h3 class="font-semibold text-sm">Copias de seguridad locales</h3><div class="flex flex-wrap gap-2 mt-2"><button class="btn" onclick="backup()">💾 Backup JSON</button>
    <label class="btn cursor-pointer">Restaurar Backup<input type="file" accept=".json" class="hidden" onchange="restaurar(this)"></label></div>
    <p class="text-xs text-slate-500 mt-2">El backup conserva datos locales de este navegador. Los registros oficiales de lectura y evaluación permanecen en Google Sheets.</p>
   </div>
  </div>`;
}
async function guardarCodigoGeneral() {
  const codigo = $('#codigoNuevo').value.trim();
  if (!/^[A-Za-z0-9_-]{3,30}$/.test(codigo)) return alert('La clave debe tener entre 3 y 30 caracteres: letras, números, guion o guion bajo.');
  if (!confirm('¿Cambiar el código general de acceso? Los estudiantes deberán utilizar el nuevo código desde el próximo ingreso.')) return;
  try { const j = await postAdmin('cambiarCodigo', {codigo}); if (!j.ok) throw new Error(j.error || 'No se pudo cambiar el código.'); $('#codigoNuevo').value=''; alert('Código general actualizado correctamente.'); }
  catch(e) { alert(e.message); }
}

function backup() {
  const o = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(P)) o[k] = localStorage.getItem(k); }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], {type: 'application/json'})); a.download = 'LEE60_backup_' + hoy() + '.json'; a.click();
}
function restaurar(inp) {
  const f = inp.files[0]; if (!f) return; const fr = new FileReader();
  fr.onload = () => { try { const o = JSON.parse(fr.result); Object.keys(o).forEach(k => k.startsWith(P) && localStorage.setItem(k, o[k]));
    S = ld('est', S); L = ld('libros', L); alert('Backup restaurado.'); aSis(); } catch (e) { alert('Archivo inválido.'); } };
  fr.readAsText(f);
}
function nuevaSesion() { if (!confirm('¿Limpiar timers y evidencias de hoy?')) return; S.forEach(r => Object.assign(r, {t0: null, seg: 0, est: 'Sin iniciar', antes: {}})); pausa = null; save(); alert('Nueva sesión lista.'); }
function borrarTodo() { if (!confirm('¿Borrar los datos locales guardados en este navegador? No se eliminarán los datos de Google Sheets ni Drive.')) return; Object.keys(localStorage).filter(k => k.startsWith(P)).forEach(k => localStorage.removeItem(k)); S = []; L = []; alert('Datos locales eliminados.'); aSis(); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=lee60-v5').then(reg => reg.update()).catch(() => {}); // modo offline
vistaLogin();
